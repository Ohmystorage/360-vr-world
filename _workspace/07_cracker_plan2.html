<!doctype html><html><head><meta charset="utf-8">
<style>
 body{margin:0;width:1400px;background:#fbfaf6;font-family:"Segoe UI","Malgun Gothic",sans-serif;color:#222}
 h1{font-size:26px;text-align:center;margin:16px 0 4px}
 .s{text-align:center;font-size:15px;color:#555;margin-bottom:10px}
 .g{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:0 24px}
 figure{margin:0;background:#fff;border:1px solid #ddd;border-radius:10px;padding:8px}
 figure img{width:100%;border-radius:6px;display:block}
 figcaption{font-size:16px;font-weight:700;margin:6px 4px 2px}
 .n{font-size:14px;font-weight:400;color:#444}
 .bad{color:#b00020}.good{color:#2e7d32}
 .foot{margin:14px 24px 18px;font-size:15px;line-height:1.7;background:#fff;border:1px solid #ddd;border-radius:10px;padding:10px 16px}
</style></head><body>
<h1>크래커 시안 (실제 장면에서 찍은 화면)</h1>
<div class="s">개미집에서 크래커 쪽으로 반쯤 걸어온 곳에서 같은 방향으로 찍었습니다.</div>
<div class="g">
 <figure><img src="07_view_mid.png"><figcaption class="bad">지금 <span class="n">— 크래커가 잔디 뒤에 완전히 숨음</span></figcaption></figure>
 <figure><img src="07_proto_mid_s3.png"><figcaption class="good">시안 A: 3배 <span class="n">— 약 18cm 사각 크래커, 돌에 40° 걸쳐 앞면이 개미 쪽을 봄</span></figcaption></figure>
 <figure><img src="07_proto_mid_s4.png"><figcaption class="good">시안 B: 4배 <span class="n">— 약 24cm, 더 크고 멀리서도 잘 보임</span></figcaption></figure>
 <figure><img src="07_proto_near_s3.png"><figcaption class="good">시안 A를 가까이서 <span class="n">— 노란 구멍 뚫린 크래커가 확실히 보임</span></figcaption></figure>
</div>
<div class="foot"><b>함께 바뀌는 것:</b> 크래커 색을 조금 더 밝은 황금색으로 · 보도 옆 잔디 중 크래커 근처만 짧게 · 분홍 고리를 커진 크래커 위로 올림 · 크래커가 길을 막는 범위(부딪힘)도 크기에 맞춤.<br>
<b>그대로:</b> 크래커 위치, 카드 글 "A Cracker Too Big", 걷는 속도, 다른 장소, 안내 페이지.</div>
</body></html>
