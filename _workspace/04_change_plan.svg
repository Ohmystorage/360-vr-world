<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Segoe UI, Malgun Gothic, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4fa3" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ff4fa3" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff4fa3" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1000" height="640" fill="#fbfaf6"/>
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#222">4단계 수정안: 숫자 1~3 모두 빼기</text>

  <!-- column headers -->
  <text x="300" y="80" text-anchor="middle" font-size="18" font-weight="700" fill="#888">지금</text>
  <text x="720" y="80" text-anchor="middle" font-size="18" font-weight="700" fill="#c2185b">바꾼 후</text>

  <!-- ROW 1: in-world -->
  <text x="30" y="150" font-size="17" font-weight="700" fill="#222">가상 세계</text>
  <text x="30" y="172" font-size="13" fill="#666">(장소 위 표시)</text>
  <rect x="170" y="95" width="260" height="160" rx="10" fill="#cfe3c5"/>
  <circle cx="300" cy="140" r="34" fill="none" stroke="#ff4fa3" stroke-width="5" opacity="0.7"/>
  <circle cx="300" cy="140" r="24" fill="#d81b75"/>
  <text x="300" y="149" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">1</text>
  <path d="M290,190 L310,190 L310,205 L320,205 L300,228 L280,205 L290,205 z" fill="#ff4fa3"/>
  <rect x="270" y="234" width="60" height="14" rx="2" fill="#d9b36c"/>
  <text x="300" y="250" text-anchor="middle" font-size="10" fill="#6b4b1a">크래커</text>

  <line x1="450" y1="175" x2="545" y2="175" stroke="#555" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="590" y="95" width="260" height="160" rx="10" fill="#cfe3c5"/>
  <circle cx="720" cy="140" r="34" fill="none" stroke="#ff4fa3" stroke-width="5" opacity="0.85"/>
  <circle cx="720" cy="140" r="44" fill="none" stroke="#ff4fa3" stroke-width="2" opacity="0.35"/>
  <path d="M710,190 L730,190 L730,205 L740,205 L720,228 L700,205 L710,205 z" fill="#ff4fa3"/>
  <rect x="690" y="234" width="60" height="14" rx="2" fill="#d9b36c"/>
  <text x="720" y="250" text-anchor="middle" font-size="10" fill="#6b4b1a">크래커</text>
  <text x="865" y="135" font-size="13" fill="#c2185b">숫자 동그라미만 빠짐</text>
  <text x="865" y="155" font-size="13" fill="#c2185b">깜빡이는 고리 +</text>
  <text x="865" y="175" font-size="13" fill="#c2185b">아래 화살표는 그대로</text>
  <text x="865" y="195" font-size="13" fill="#c2185b">(클릭하면 카드 열림)</text>

  <!-- ROW 2: minimap -->
  <text x="30" y="345" font-size="17" font-weight="700" fill="#222">미니맵</text>
  <rect x="170" y="285" width="260" height="140" rx="8" fill="#5a8a46" stroke="#fff" stroke-width="3"/>
  <circle cx="230" cy="330" r="13" fill="#d81b75" stroke="#fff" stroke-width="2"/><text x="230" y="335" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <circle cx="300" cy="380" r="13" fill="#d81b75" stroke="#fff" stroke-width="2"/><text x="300" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <circle cx="380" cy="320" r="13" fill="#2e9e4f" stroke="#fff" stroke-width="2"/><path d="M373,320 l5,5 l9,-10" fill="none" stroke="#fff" stroke-width="3"/>

  <line x1="450" y1="355" x2="545" y2="355" stroke="#555" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="590" y="285" width="260" height="140" rx="8" fill="#5a8a46" stroke="#fff" stroke-width="3"/>
  <circle cx="650" cy="330" r="18" fill="url(#glow)"/><circle cx="650" cy="330" r="7" fill="#ff4fa3" stroke="#fff" stroke-width="1.5"/>
  <circle cx="720" cy="380" r="18" fill="url(#glow)"/><circle cx="720" cy="380" r="7" fill="#ff4fa3" stroke="#fff" stroke-width="1.5"/>
  <circle cx="800" cy="320" r="13" fill="#2e9e4f" stroke="#fff" stroke-width="2"/><path d="M793,320 l5,5 l9,-10" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="865" y="325" font-size="13" fill="#c2185b">숫자 없는 핑크 점이</text>
  <text x="865" y="345" font-size="13" fill="#c2185b">계속 빛나며 깜빡임</text>
  <text x="865" y="375" font-size="13" fill="#2e7d32">읽은 곳은 초록 체크</text>
  <text x="865" y="395" font-size="13" fill="#2e7d32">(지금처럼 유지)</text>

  <!-- ROW 3: popup + help line -->
  <text x="30" y="500" font-size="17" font-weight="700" fill="#222">카드 제목</text>
  <text x="30" y="522" font-size="13" fill="#666">+ 안내 문구</text>
  <rect x="170" y="465" width="260" height="58" rx="8" fill="#fffdf3" stroke="#ccc"/>
  <circle cx="195" cy="494" r="13" fill="#d81b75"/><text x="195" y="499" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <text x="216" y="500" font-size="17" font-weight="700" fill="#222">A Cracker Too Big</text>
  <text x="170" y="550" font-size="12" fill="#444">… · Read: click a pink number</text>

  <line x1="450" y1="510" x2="545" y2="510" stroke="#555" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="590" y="465" width="260" height="58" rx="8" fill="#fffdf3" stroke="#ccc"/>
  <text x="608" y="500" font-size="17" font-weight="700" fill="#222">A Cracker Too Big</text>
  <text x="590" y="550" font-size="12" fill="#444">… · Read: click a pink ring</text>
  <text x="865" y="495" font-size="13" fill="#c2185b">제목 앞 숫자 빠짐</text>
  <text x="865" y="550" font-size="13" fill="#c2185b">"number" → "ring"</text>

  <text x="500" y="610" text-anchor="middle" font-size="14" fill="#666">나머지(카드 글, 걷는 속도, 장소 모습, 걷기 멈춤)는 그대로입니다.</text>
</svg>
