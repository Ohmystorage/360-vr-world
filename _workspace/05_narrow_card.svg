<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="Segoe UI, Malgun Gothic, sans-serif">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf3" stop-opacity="0"/><stop offset="1" stop-color="#fffdf3" stop-opacity="1"/></linearGradient>
    <clipPath id="clipA"><rect x="0" y="0" width="300" height="430" rx="10"/></clipPath>
    <clipPath id="clipB"><rect x="0" y="0" width="300" height="430" rx="10"/></clipPath>
    <g id="cardtext" font-size="13" fill="#222">
      <text x="16" y="34" font-size="18" font-weight="700">A Web in the Way</text>
      <text x="16" y="62">You smell something sweet. A ripe</text>
      <text x="16" y="80">strawberry fell on the other side of</text>
      <text x="16" y="98">the fence! The fence sits tight on the</text>
      <text x="16" y="116">ground. There is only one small gap</text>
      <text x="16" y="134">under it. But a spider web covers</text>
      <text x="16" y="152">the gap.</text>
      <text x="16" y="182" font-weight="700" fill="#7a4a12">Why is it hard?</text>
      <text x="16" y="204">Climbing over the tall fence takes a</text>
      <text x="16" y="222">very long time. Spider silk is thin,</text>
      <text x="16" y="240">strong and sticky. If you touch it,</text>
      <text x="16" y="258">you could get stuck. The spider would</text>
      <text x="16" y="276">feel the web shake.</text>
      <text x="16" y="306" font-weight="700" fill="#7a4a12">Words to know</text>
      <text x="16" y="328">• silk: the thin, strong threads a</text>
      <text x="16" y="346">  spider makes</text>
      <rect x="12" y="372" width="276" height="84" rx="6" fill="#fff1a8"/>
      <rect x="12" y="372" width="5" height="84" fill="#d81b75"/>
      <text x="26" y="396" font-weight="700" fill="#7a4a12">Your design challenge</text>
      <text x="26" y="418" font-weight="700">How could you help ants get past</text>
      <text x="26" y="436" font-weight="700">the web safely to reach the</text>
      <text x="26" y="454" font-weight="700">strawberry?</text>
    </g>
  </defs>
  <rect width="1200" height="860" fill="#fbfaf6"/>
  <text x="600" y="40" text-anchor="middle" font-size="25" font-weight="700" fill="#222">좁은 화면(휴대폰 폭)에서 거미줄 카드</text>

  <!-- NOW -->
  <text x="300" y="88" text-anchor="middle" font-size="20" font-weight="700" fill="#888">지금</text>
  <g transform="translate(130,105)">
    <rect x="-20" y="-10" width="380" height="640" rx="36" fill="#333"/>
    <rect x="0" y="10" width="340" height="600" rx="22" fill="#6a8f55"/>
    <g transform="translate(20,40)">
      <rect width="300" height="430" rx="10" fill="#fffdf3"/>
      <g clip-path="url(#clipA)"><use href="#cardtext"/></g>
      <rect x="0" y="380" width="300" height="50" fill="#fffdf3"/>
      <rect x="0" y="372" width="300" height="2" fill="#eee"/>
      <rect x="85" y="386" width="130" height="34" rx="6" fill="#1f5fbf"/>
      <text x="150" y="409" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Close</text>
    </g>
    <text x="170" y="535" text-anchor="middle" font-size="14" fill="#fff">(화면 끝)</text>
  </g>
  <g font-size="15" fill="#b00020">
    <text x="40" y="770">✗ 노란 질문 상자가 Close 버튼 뒤에 가려져 안 보임</text>
    <text x="40" y="795">✗ "아래에 더 있다"는 표시가 없어서 카드가 끝난 줄 앎</text>
    <text x="40" y="820">✗ 학생이 질문을 못 보고 Close를 누를 수 있음</text>
  </g>

  <!-- AFTER -->
  <text x="900" y="88" text-anchor="middle" font-size="20" font-weight="700" fill="#c2185b">바꾼 후</text>
  <g transform="translate(730,105)">
    <rect x="-20" y="-10" width="380" height="640" rx="36" fill="#333"/>
    <rect x="0" y="10" width="340" height="600" rx="22" fill="#6a8f55"/>
    <g transform="translate(20,40)">
      <rect width="300" height="430" rx="10" fill="#fffdf3"/>
      <g clip-path="url(#clipB)"><use href="#cardtext"/></g>
      <rect x="0" y="300" width="300" height="80" fill="url(#fade)"/>
      <rect x="70" y="344" width="160" height="28" rx="14" fill="#d81b75"/>
      <text x="150" y="363" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">▼ Scroll for more</text>
      <rect x="0" y="380" width="300" height="50" fill="#fffdf3"/>
      <rect x="0" y="372" width="300" height="2" fill="#eee"/>
      <rect x="85" y="386" width="130" height="34" rx="6" fill="#1f5fbf"/>
      <text x="150" y="409" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Close</text>
    </g>
    <text x="170" y="535" text-anchor="middle" font-size="14" fill="#fff">(화면 끝)</text>
  </g>
  <g font-size="15" fill="#2e7d32">
    <text x="640" y="770">✓ 아래쪽이 흐려지고 "▼ Scroll for more"가 보임</text>
    <text x="640" y="795">✓ 끝까지 내려 질문이 보이면 표시가 사라짐</text>
    <text x="640" y="820">✓ 노트북 화면처럼 다 보일 때는 처음부터 표시 없음</text>
  </g>
</svg>
