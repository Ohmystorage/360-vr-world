<!doctype html><html><head><meta charset="utf-8">
<style>
 body{margin:0;width:1100px;background:#fbfaf6;font-family:"Malgun Gothic","Segoe UI",sans-serif;color:#222}
 h1{font-size:24px;margin:14px 20px 8px}
 .shot{position:relative;margin:0 20px;border-radius:8px;overflow:hidden}
 .shot img{width:100%;display:block}
 .shot svg{position:absolute;inset:0;width:100%;height:100%}
 .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 20px}
 .opt{background:#fff;border:1px solid #ddd;border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.55}
 .demo{height:90px;border-radius:6px;background:url(11_vr_hint.png) 85% 10%/600px;display:flex;align-items:center;justify-content:center}
 .b{font:700 22px Arial;color:#fff;padding:8px 16px;border-radius:10px;border:3px solid #fff}
 .n{margin:4px 20px 16px;font-size:15.5px;line-height:1.65}
</style></head><body>
<h1>Exit VR 시안 (수정): 흰 테두리 · 더 위쪽 · 더 오른쪽 (헤드셋 안)</h1>
<div class="shot"><img src="11_vr_hint.png">
 <svg viewBox="0 0 1280 720" font-family="Arial">
  <rect x="470" y="484" width="340" height="54" rx="27" fill="#d81b70" stroke="#fff" stroke-width="3"/>
  <text x="640" y="508" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">✉  Read the message</text>
  <text x="640" y="528" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">point at ✉ and pull the trigger · or press A / X</text>
  <rect x="1106" y="16" width="160" height="56" rx="12" fill="rgba(0,0,0,.45)" stroke="#fff" stroke-width="3"/>
  <text x="1186" y="53" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">Exit VR</text>
  <g font-family="Malgun Gothic" font-size="16" font-weight="700">
   <rect x="846" y="82" width="420" height="32" rx="8" fill="rgba(0,0,0,.72)"/><text x="1056" y="104" fill="#fff" text-anchor="middle">더 위·더 오른쪽 · 흰 테두리 · 고개를 돌려도 늘 이 자리</text>
  </g>
 </svg></div>
<div class="row">
 <div class="opt"><div class="demo"><span class="b" style="background:rgba(0,0,0,.45)">Exit VR</span></div>평소: 반투명 검정 바탕 + 흰 테두리 + 흰 굵은 글자 "Exit VR"</div>
 <div class="opt"><div class="demo"><span class="b" style="background:#ef2d5e">Exit VR</span></div>컨트롤러 선이 닿으면 분홍 → 방아쇠를 당기면 헤드셋 모드가 끝나고 컴퓨터(2D) 화면으로 돌아감</div>
</div>
<div class="n">· 걸을 때, 카드를 읽을 때, 언제나 보임 (선이 안 보일 때도 버튼은 늘 있음)<br>
· 색·글꼴은 헤드셋 안 "Enter VR" 버튼 스크린샷을 받으면 그대로 맞춤<br>
· 지금 시야 오른쪽 위의 "VR" 표시 버튼은 이 버튼으로 바뀜. 나머지는 그대로</div>
</body></html>
