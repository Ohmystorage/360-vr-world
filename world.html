<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ant's-Eye World</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="js/problems.js"></script>
  <script src="js/components.js"></script>
  <script src="js/hotspots.js"></script>
  <style>
    #title {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      padding: 10px 14px; border-radius: 10px;
      background: rgba(255, 255, 255, 0.85); color: #222;
      font: 18px/1.4 Arial, Helvetica, sans-serif;
      pointer-events: none; box-sizing: border-box; max-width: calc(100vw - min(220px, 32vw) - 48px);
    }
    #title b { font-size: 20px; }
    /* Minimap: top right, away from the middle of the view */
    #map {
      position: fixed; top: 12px; right: 12px; z-index: 10;
      width: min(220px, 32vw); aspect-ratio: 1; overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.9); border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); pointer-events: none;
    }
    #map canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    /* Stage 4: pointer over a hotspot (beats A-Frame's grab cursor) */
    .a-canvas.a-mouse-cursor-hover:hover { cursor: pointer !important; }
    /* Card pop-up: fits 1280x720, scrolls inside on small windows; Close stays visible at the bottom */
    #card-back {
      position: fixed; inset: 0; z-index: 10000; padding: 16px; box-sizing: border-box;  /* above A-Frame's VR button */
      display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.45);
    }
    #card-back[hidden], #card-words-box[hidden], #hint[hidden], #read-btn[hidden] { display: none; }
    #card {
      width: 100%; max-width: 680px; max-height: 100%; overflow-y: auto; box-sizing: border-box;
      padding: 22px 26px 0; border-radius: 14px; background: #fffdf6; color: #1a1a1a;
      font: 20px/1.5 Arial, Helvetica, sans-serif; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
    }
    #card h2 { display: flex; align-items: center; gap: 12px; margin: 0 0 10px; font-size: 28px; line-height: 1.2; }
    #card h3 { margin: 16px 0 4px; font-size: 21px; color: #6b3200; }
    #card p, #card ul { margin: 0; }
    #card ul { padding-left: 24px; }
    #card-q-box { margin-top: 18px; padding: 12px 16px; border-left: 8px solid #d4006e; border-radius: 8px; background: #fff1a8; }
    #card-q-box h3 { margin-top: 0; }
    #card-q { font-weight: bold; }
    #card-foot { position: sticky; bottom: 0; padding: 14px 0 20px; background: #fffdf6; text-align: center; }
    #card-close {
      min-width: 160px; min-height: 52px; padding: 10px 36px; border: 0; border-radius: 10px;
      background: #1f5fbf; color: #fff; font: bold 22px Arial, Helvetica, sans-serif; cursor: pointer;
    }
    #card-close:focus-visible { outline: 4px solid #ffb300; outline-offset: 3px; }
    #hint {
      position: fixed; left: 50%; bottom: 130px; transform: translateX(-50%); z-index: 15; padding: 12px 22px;
      border-radius: 10px; background: rgba(20, 20, 20, 0.85); color: #fff; font: bold 22px Arial, Helvetica, sans-serif;
      pointer-events: none; text-align: center; width: max-content; max-width: calc(100vw - 32px); box-sizing: border-box;
    }
    /* Rev 4: big "Read the message" button, shown near a place (js/hotspots.js) */
    #read-btn {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      width: max-content; max-width: calc(100vw - 32px); box-sizing: border-box; padding: 12px 34px 10px;
      border: 3px solid #fff; border-radius: 999px; background: #e0186f; color: #fff; cursor: pointer;
      font: bold 26px/1.15 Arial, Helvetica, sans-serif; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }
    #read-btn small { font: bold 15px/1.2 Arial, Helvetica, sans-serif; opacity: 0.92; }
    #read-btn:hover { background: #c3115e; }
    #read-btn:focus-visible { outline: 4px solid #ffb300; outline-offset: 3px; }
    @media (max-width: 600px) {  /* lift it above A-Frame's VR button (bottom right) */
      #read-btn { bottom: 84px; font-size: 22px; }
      #hint { bottom: 190px; }
    }
  </style>
</head>
<body>
  <div id="title">
    <b id="place-name">Ant's-Eye World</b><br>
    Move: arrow keys or W A S D &middot; Look: drag the mouse &middot; Read: walk to a pink ring
  </div>
  <div id="map">
    <canvas id="map-base" width="480" height="480"></canvas>
    <canvas id="map-spots" width="480" height="480"></canvas>
    <canvas id="map-ant" width="480" height="480"></canvas>
  </div>
  <!-- Stage 4: card pop-up, filled from window.ANT_PROBLEMS by js/hotspots.js -->
  <div id="card-back" hidden>
    <div id="card" role="dialog" aria-modal="true" aria-labelledby="card-title">
      <h2 id="card-title"><span id="card-title-text"></span></h2>
      <p id="card-problem"></p>
      <h3>Why is it hard?</h3>
      <p id="card-why"></p>
      <div id="card-words-box">
        <h3>Words to know</h3>
        <ul id="card-words"></ul>
      </div>
      <div id="card-q-box">
        <h3>Your design challenge</h3>
        <p id="card-q"></p>
      </div>
      <div id="card-foot"><button id="card-close" type="button">Close</button></div>
    </div>
  </div>
  <div id="hint" hidden></div>
  <button id="read-btn" type="button" hidden>&#9993; Read the message<small>click or press Enter</small></button>

  <!-- Scale: 1 real cm = 8 scene m (x800). Ant eye = camera at y 1.6. -->
  <a-scene renderer="antialias: true; logarithmicDepthBuffer: true"
           background="color: #c4e0f4"
           fog="type: linear; color: #c4e0f4; near: 500; far: 7000"
           cursor="rayOrigin: mouse" raycaster="objects: .hotspot; far: 6000">

    <a-entity light="type: hemisphere; color: #eef7ff; groundColor: #9a8a66; intensity: 1.6"></a-entity>
    <a-entity light="type: directional; color: #fff6e0; intensity: 2.2" position="-1 1.6 0.5"></a-entity>

    <!-- Camera: worm's-eye. Rev 4: starts at the ant nest in the south-east lawn corner (at the hole's edge),
         facing north-west into the yard (start spot = YARD.nest in the script below) -->
    <!-- Walking: wasd-controls (WASD + arrow keys, stays on the ground); ant-walk keeps the ant in the yard
         and out of solid things (js/components.js). Rig rotation stays 0; start yaw is set on look-controls. -->
    <a-entity id="rig" position="1017 0 1037">
      <a-camera id="cam" position="0 1.6 0" camera="near: 0.1; far: 12000; fov: 80"
                look-controls="pointerLockEnabled: false" wasd-controls="acceleration: 357.5; fly: false"
                ant-walk></a-camera>
    </a-entity>

    <!-- Ground: base, lawn, driveway, sidewalk (walkway from porch to front fence) -->
    <a-plane rotation="-90 0 0" position="0 -1 0" width="20000" height="20000"
             material="color: #7d8a5c; roughness: 1"></a-plane>
    <a-plane rotation="-90 0 0" position="540 -0.4 -150" width="1920" height="3300"
             material="color: #5b8c38; roughness: 1"></a-plane>
    <a-plane rotation="-90 0 0" position="-410 -0.35 0" width="20" height="2160"
             material="color: #6b5034; roughness: 1"></a-plane>
    <a-plane rotation="-90 0 0" position="-1155 -0.8 0" width="990" height="3600"
             material="color: #34363a; roughness: 1"></a-plane>
    <a-box id="sidewalk" position="-540 -1 680" width="240" height="2" depth="1640"
           material="color: #aab0b5; roughness: 1"></a-box>
    <!-- Concrete landing at the foot of the porch steps (the walkway leads here) -->
    <a-box id="landing" position="-340 -1 -350" width="840" height="2" depth="420"
           material="color: #aab0b5; roughness: 1"></a-box>
    <a-entity id="joints"></a-entity>

    <!-- Place 1 (id heavy-cracker): a bitten M&M cookie (18 cm across real), west edge propped on a stone.
         Cookie, toppings, stone and crumbs are built in the script below (2 merged meshes). -->
    <a-entity id="place-heavy-cracker">
      <!-- A cut grass blade lying on the sidewalk -->
      <a-box position="-560 0.2 330" rotation="0 30 0" width="2.8" height="0.35" depth="55"
             material="color: #6a9a3a; roughness: 1"></a-box>
    </a-entity>
    <a-entity id="detail"></a-entity>

    <!-- Backdrop: our house (wall face at z = -1280), porch, garage door, roof.
         Moved 520 m south in the 3-place version so the doormat is ~11 s from the cookie. -->
    <a-box position="-400 1400 -1680" width="4400" height="2800" depth="800" material="color: #efe3c8; roughness: 1"></a-box>
    <a-box position="-400 2944 -1430" rotation="30 0 0" width="4600" height="60" depth="620" color="#6b4f45"></a-box>
    <a-box position="-400 2944 -1930" rotation="-30 0 0" width="4600" height="60" depth="620" color="#6b4f45"></a-box>
    <a-box position="-1180 850 -1275" width="900" height="1700" depth="20" color="#f4f1ea"></a-box>
    <a-box position="-1180 500 -1263" width="900" height="12" depth="4" color="#c9c4b8"></a-box>
    <a-box position="-1180 900 -1263" width="900" height="12" depth="4" color="#c9c4b8"></a-box>
    <a-box position="-1180 1300 -1263" width="900" height="12" depth="4" color="#c9c4b8"></a-box>
    <a-box position="400 1700 -1275" width="1000" height="1000" depth="20" color="#ffffff"></a-box>
    <a-box position="400 1700 -1264" width="880" height="880" depth="10" color="#8fb3cc"></a-box>
    <a-box position="1200 1700 -1275" width="1000" height="1000" depth="20" color="#ffffff"></a-box>
    <a-box position="1200 1700 -1264" width="880" height="880" depth="10" color="#8fb3cc"></a-box>
    <!-- Porch: steps 18 cm real = 144 m each; bottom step front face at z = -560 -->
    <a-box position="-440 216 -1160" width="500" height="432" depth="240" color="#b9b4aa"></a-box>
    <a-box position="-440 144 -920" width="500" height="288" depth="240" color="#c2bdb3"></a-box>
    <a-box position="-440 72 -680" width="500" height="144" depth="240" color="#cbc6bc"></a-box>
    <!-- Step nosings (lighter edge that sticks out 1 cm) and a dark dirt line at the bottom step's base -->
    <a-box position="-440 139 -556" width="510" height="10" depth="16" color="#dedad2"></a-box>
    <a-box position="-440 283 -796" width="510" height="10" depth="16" color="#dedad2"></a-box>
    <a-box position="-440 427 -1036" width="510" height="10" depth="16" color="#dedad2"></a-box>
    <a-box position="-440 2 -559" width="502" height="4" depth="4" color="#5e5850"></a-box>
    <a-box position="-440 1257 -1271" width="760" height="1650" depth="20" color="#7a3b2a"></a-box>
    <!-- Place 6 (giant-feet): doormat, crumbs, shoe and print are built in the script below -->
    <a-entity id="place-giant-feet"></a-entity>
    <!-- Place 8 (fence-web): fence, garden bed, web, spider, hose and dandelions are built in the script below -->
    <a-entity id="place-fence-web"></a-entity>
    <!-- Low hedge on the play area's east edge and the lawn's south edge (one merged mesh, built in the script below) -->
    <a-entity id="yard-hedge"></a-entity>
    <!-- West edge: low brick border with the family car parked behind it. South edge on the walkway and driveway:
         white picket fence with a closed garden gate and driveway gate (two merged meshes, built in the script below) -->
    <a-entity id="yard-edges"></a-entity>
    <!-- Rev 4: ant nest entrance in the south-east lawn corner, where the game starts (merged mesh, built in the script below) -->
    <a-entity id="yard-nest"></a-entity>

    <!-- Backdrop: neighbor's house to the east -->
    <a-box position="4300 1300 1700" width="3000" height="2600" depth="2600" material="color: #bcd3e6; roughness: 1"></a-box>
    <a-box position="3450 3091 1700" rotation="0 0 30" width="1963" height="60" depth="2900" color="#5a5f6b"></a-box>
    <a-box position="5150 3091 1700" rotation="0 0 -30" width="1963" height="60" depth="2900" color="#5a5f6b"></a-box>
    <!-- Side wall facing our yard (x = 2800): trim, windows, door, gutter, downspout, bushes -->
    <a-box position="2790 150 1700" width="20" height="300" depth="2640" color="#8e8a82"></a-box>
    <a-box position="2790 1300 410" width="20" height="2600" depth="80" color="#ffffff"></a-box>
    <a-box position="2790 1300 2990" width="20" height="2600" depth="80" color="#ffffff"></a-box>
    <a-box position="2770 2610 1700" width="80" height="80" depth="2700" color="#e8e8e8"></a-box>
    <a-cylinder position="2760 1300 460" radius="40" height="2600" color="#d8d8d8"></a-cylinder>
    <a-box position="2700 40 460" width="160" height="60" depth="80" color="#d8d8d8"></a-box>
    <a-box position="2792 900 1750" width="20" height="1800" depth="760" color="#ffffff"></a-box>
    <a-box position="2781 850 1750" width="6" height="1700" depth="640" color="#3d6b4f"></a-box>
    <a-sphere position="2772 850 1990" radius="35" color="#d9b54a"></a-sphere>
    <a-box position="2690 72 1750" width="220" height="144" depth="900" color="#b9b4aa"></a-box>
    <a-entity id="neighbor-side"></a-entity>

    <!-- Backdrop: neighbor's house to the west, across the driveway -->
    <a-box position="-5200 1300 300" width="3000" height="2600" depth="3400" material="color: #e8c9a8; roughness: 1"></a-box>
    <a-box position="-4350 3091 300" rotation="0 0 30" width="1963" height="60" depth="3700" color="#7a5a4a"></a-box>
    <a-box position="-6050 3091 300" rotation="0 0 -30" width="1963" height="60" depth="3700" color="#7a5a4a"></a-box>
    <a-box position="-3695 1500 300" width="20" height="900" depth="900" color="#8fb3cc"></a-box>
  </a-scene>

  <script>
    // Shared yard layout (scene metres; x = east, z = south, camera starts facing east).
    // 3-place version (teacher's decision): walk order cookie -> doormat -> web
    // ("sidewalk -> house -> garden"). Walking speed ~65 m/s (wasd acceleration 357.5 = teacher's +30% over 275,
    //   which was +20% over 229.2). Edge to edge ~38 s.
    // Zones: driveway x -1650..-660, walkway x -660..-420 (z -140..1500),
    // porch landing x -760..60 (z -560..-140), porch steps x -690..-190 (z -1280..-560),
    // lawn x -420..1500, house wall z -1280.
    // fence-web: wooden fence along x 360..456 from the house wall (z -1280) to the end post
    // (z -575..-495); web hub at (424, 85, -660); garden bed x 494..1170, z -800..-280.
    // The web covers the only opening in the fence (rotted board ends, z -718..-575); a strawberry lies
    // just past it at (475, -655), in the soil strip between the boards and the bed.
    // placed: false = card kept in the data but NOT placed in the 3-place version (nothing drawn).
    // tip = stage 4 hotspot: height (m) of the old arrow tip above the place's x, z; the envelope icon in the pulsing
    // ring's center sits just above it. Chosen to clear the cookie (raised west edge ~96 m; the ring sits above it in the
    // near views), the mat (~17 m) and the web (top 164 m).
    // Rev 4: the game always starts at the ant nest (YARD.nest); the ?place= shortcut is gone.
    window.PLACES = [
      { id: "heavy-cracker", x: -540,  z: 400,  placed: true, tip: 110 },  // the cookie: sidewalk, between driveway and lawn
      { id: "giant-feet",    x: -440,  z: -380, placed: true, tip: 30 },   // doormat at the bottom of the porch steps
      { id: "fence-web",     x: 400,   z: -660, placed: true, tip: 178 },  // web under the bottom rail by the fence end post
      { id: "nest-guard",    x: 850,   z: -150, placed: false },
      { id: "rain-flood",    x: 1250,  z: 500,  placed: false },
      { id: "hot-driveway",  x: -1150, z: -350, placed: false },
      { id: "lost-trail",    x: 600,   z: -900, placed: false },
      { id: "sidewalk-gap",  x: -540,  z: 1350, placed: false }
    ];

    // ONE shared footprint list (stage 3): js/components.js uses it for walking limits AND the minimap,
    // so the two cannot drift apart. Numbers copied from the 3D objects below (scene m, x = east, z = south).
    // Box: x, z = center, w = size along x, d = size along z, rot = y rotation in degrees. Circle: x, z, r.
    // No color = solid but not drawn on the map. Grass blades are not here: the ant walks between them.
    window.YARD = {
      // Play area. Edge to edge about 2470 m = about 35 s at 70 m/s. The east edge (x 1170) is the garden
      // bed's east end, so there is no way around the bed: the strawberry can only be reached through the web.
      // A low hedge stands along that edge (west face at x 1170) and along the lawn part of the south edge
      // (north face at z 1200, x -420..1170), so the ant stops at a visible wall there.
      // Rev 3: the west edge (x -1300) is a low brick border with the family car parked behind it, and the
      // walkway/driveway part of the south edge is a white picket fence with gates (north face z 1198).
      bounds: { x0: -1300, x1: 1170, z0: -1280, z1: 1200 },
      zones: [  // walkable ground, drawn on the minimap only
        { x: 540,   z: -150, w: 1920, d: 3300, color: "#5b8c38" },  // lawn
        { x: -1155, z: 0,    w: 990,  d: 3600, color: "#34363a" },  // driveway
        { x: -540,  z: 680,  w: 240,  d: 1640, color: "#aab0b5" },  // walkway / sidewalk
        { x: -340,  z: -350, w: 840,  d: 420,  color: "#aab0b5" },  // porch landing
        { x: -2124, z: -40,  w: 1552, d: 2480, color: "#9d968a" }   // gravel parking strip under the car
      ],
      solids: [
        { name: "house",         x: -400,   z: -1680, w: 4400, d: 800,  color: "#efe3c8" },
        { name: "garage door",   x: -1180,  z: -1275, w: 900,  d: 20 },  // sticks out 15 m from the wall (rev 3 fix)
        { name: "porch steps",   x: -440,   z: -914,  w: 510,  d: 732,  color: "#c9c4ba", edge: "#8f8a80" },
        { name: "doormat",       x: -440,   z: -380,  w: 480,  d: 320,  color: "#b8864e", edge: "#1e1d1b" },
        // Rev 4: the person's right shoe standing on the first porch step (the lifted left shoe is overhead: not solid)
        { name: "standing shoe", x: -400,   z: -680,  w: 86,   d: 236,  color: "#3d6db3" },
        // Cookie (radius 72 m) and the stone under its raised west edge (ground cross-section). The map draws the
        // cookie's real outline with the bite (poly, set where the cookie is built); walking uses the circle.
        { name: "cookie",        x: -540,   z: 400,   r: 72,            color: "#d9a35c", edge: "#8a5a2b" },
        { name: "cookie stone",  x: -620,   z: 400,   r: 33 },
        { name: "fence",         x: 448,    z: -887,  w: 18,   d: 788,  color: "#6b4f35" },
        { name: "fence post",    x: 400,    z: -900,  w: 80,   d: 80,   color: "#6b4f35" },
        { name: "end post",      x: 400,    z: -535,  w: 80,   d: 80,   color: "#6b4f35" },
        // Spider web (plane x 424, z -770..-575 with its anchor threads), not on the map. The block starts
        // 24 m in front of the web, so the ant stops where the whole web is in view, strawberry behind it.
        { name: "spider web",    x: 420,    z: -672,  w: 40,   d: 194 },
        { name: "garden bed",    x: 832,    z: -540,  w: 676,  d: 520,  color: "#3b2a1e", edge: "#8b6f4e" },
        { name: "bed edging",    x: 479,    z: -497,  w: 54,   d: 24,   color: "#8b6f4e" },
        { name: "flower pot",    x: 445,    z: -438,  r: 62,            color: "#c4683f" },  // base radius (rim 86 is overhead)
        // Low hedge: east edge x 1170..1470 from the house wall (z -1290) to past the south edge (z 1310),
        // and the lawn's south edge z 1200..1500 from x -420 (walkway side) to the east hedge
        { name: "hedge east",    x: 1320,   z: 10,    w: 300,  d: 2600, color: "#2e5a22" },
        { name: "hedge south",   x: 440,    z: 1350,  w: 1720, d: 300,  color: "#2e5a22" },
        // West edge: low brick border (east face x -1300) from the garage door (z -1265) to the front fence.
        // The car stands right behind it (on the map only in practice: the border stops the ant first).
        { name: "brick border",  x: -1324,  z: -33,   w: 48,   d: 2463, color: "#7a3e2a" },
        { name: "car",           x: -1988,  z: -10,   w: 1280, d: 2320, color: "#c0392b" },
        // Front fence + gates on the walkway and driveway part of the south edge, x -3000..-340 (north face z 1198)
        { name: "front fence",   x: -1670,  z: 1218,  w: 2660, d: 40,   color: "#f4f2ec" },
        { name: "neighbor east", x: 4300,   z: 1700,  w: 3000, d: 2600, color: "#bcd3e6" },
        { name: "neighbor west", x: -5200,  z: 300,   w: 3000, d: 3400, color: "#e8c9a8" }
        // Rev 4: the nest's soil rim blobs are pushed in below (circles, not drawn; the map draws YARD.nest)
      ],
      // Rev 4: ant nest entrance in the south-east lawn corner. r = outer size (map), hole = hole radius.
      // The game starts at the hole's north-west edge, facing north-west (all 3 places are > 1600 m away).
      nest: { x: 1030, z: 1050, r: 100, hole: 16 }
    };

    (function () {
      var cards = window.ANT_PROBLEMS || [];
      PLACES.forEach(function (p) {
        if (!cards.some(function (c) { return c.id === p.id; })) console.warn("No card for place id:", p.id);
      });
      // The title box is updated by ant-walk (js/components.js) with the place the ant is near.
      var placed = PLACES.filter(function (p) { return p.placed; });
      // Rev 4: start at the nest hole's north-west edge (18 m from its center), facing north-west, tilted up a little
      var N = YARD.nest, START = { x: N.x - 12.7, z: N.z - 12.7, yaw: 45, tilt: 10 };
      document.getElementById("rig").setAttribute("position", START.x + " 0 " + START.z);

      // Seeded random so the scene looks the same every time.
      var seed = 7;
      function r() {
        seed = seed + 0x6D2B79F5 | 0;
        var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      }
      function pick(a) { return a[Math.floor(r() * a.length)]; }
      function add(parent, tag, attrs) {
        var el = document.createElement(tag);
        for (var k in attrs) el.setAttribute(k, attrs[k]);
        parent.appendChild(el);
        return el;
      }
      var detail = document.getElementById("detail");
      var CAM = { x: -594, z: 420 };

      // Sidewalk joints (6-8 mm grooves = ~6 m), every 150 m; one passes just left of the start spot
      var joints = document.getElementById("joints");

        if (i % 5 === 0 && i < 16) {  // 4 dropped M&Ms
          shiny.push([new THREE.SphereGeometry(3.2, 12, 8).scale(1, 0.5, 1).translate(crx + 10, 1.5, crz + 6), new THREE.Color(MM[i / 5])]);
        }
      }
      var ckObj = document.getElementById("place-heavy-cracker").object3D;
      ckObj.add(new THREE.Mesh(merged(matte), new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: true })));
      ckObj.add(new THREE.Mesh(merged(shiny), new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.35, metalness: 0.05 })));
      YARD.solids.filter(function (f) { return f.name === "cookie"; })[0].poly =  // map outline: round cookie with the bite
        outline(CK.R).map(function (q) { return [q[0] * CK.S, q[1] * CK.S]; });

      // Stage 4: one glowing hotspot (pulsing ring + arrow) per placed place (js/hotspots.js). Not in YARD.solids:
      // it floats above the place, so it never blocks walking.
      var scene = document.querySelector("a-scene");
      placed.forEach(function (p) {
        add(scene, "a-entity", { class: "hotspot", position: p.x + " 0 " + p.z, hotspot: "id: " + p.id + "; tip: " + p.tip });
      });

      // Start view: out of the nest into the yard (yaw) and tilted up so things loom
      function tilt() {
        var lc = document.getElementById("cam").components["look-controls"];
        lc.pitchObject.rotation.x = THREE.MathUtils.degToRad(START.tilt);
        lc.yawObject.rotation.y = THREE.MathUtils.degToRad(START.yaw);
      }
      if (scene.hasLoaded) tilt(); else scene.addEventListener("loaded", tilt);
    })();
  </script>
</body>
</html>
